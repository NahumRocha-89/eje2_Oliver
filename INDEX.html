<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cadena de Frío Biológicos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container">
<h2 class="text-primary border-bottom pb-2">Log de Cadena de Frío - Vacunas</h2>
<div class="row mt-4 justify-content-center">
<div class="col-md-4">
<div class="card p-3 shadow-sm mb-3">
<input type="text" id="loteInput" class="form-control mb-2" placeholder="Código de Lote">
<input type="number" step="0.1" id="tempInput" class="form-control mb-3" placeholder="Temperatura Actual (°C)">
<button id="agregarBtn" class="btn btn-primary w-100">Registrar Lectura</button>
</div>
</div>
<div class="col-md-8">
<div class="row" id="gridLecturas">
<!-- JS generará tarjetas por cada lectura aquí -->
</div>
</div>
</div>
</div>
<script src="../JS/funciones.js"></script>
</body>
</html>
